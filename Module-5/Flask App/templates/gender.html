{% extends 'base.html' %}
{% block bodyblock %}

<div class="container">

    <div class="row">
        <div class="col">
            <br><br>
            <h3 class="display-8">Gender Classification</h3>
            <p>Upload an Image (.jpg, .jpeg, .png), our model will detect face and classify 
                the image according to the gender </p>
            <form action="#" method="POST" enctype="multipart/form-data">
                <div class="input-group">
                <input type="file" class="form-control" name="image_name" required>
                <input type="submit" value="upload & predict" class="btn btn-outline-primary">
                </div>
            </form>
        </div>
        <div class="col-8"></div>
        </div>


    </div>
</div>





{% endblock %}
